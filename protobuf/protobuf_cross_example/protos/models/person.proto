syntax = "proto3";

package protogen.models;

import "models/address.proto";
import "enums/status.proto";

// Import not used here, but shown for syntax completeness
// import "google/protobuf/timestamp.proto";

message Person {
  string name = 1;
  int32 id = 2;
  string email = 3;
  repeated string phone_numbers = 4;
  Address address = 5;
  enums.Status status = 6;
}
